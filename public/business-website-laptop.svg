      stroke="#343840"
    />

    <text
      x="253"
      y="114"
      font-family="monospace"
      font-size="7"
      fill="#A9ADB4"
    >
      https://syntaxlab.dev/core
    </text>

    <!-- Status -->
    <rect
      x="458"
      y="103"
      width="53"
      height="15"
      rx="7"
      fill="#123522"
