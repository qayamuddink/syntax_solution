    <rect x="191" y="187" width="110" height="8" rx="3" fill="#F3F3F0"/>

    <!-- Orange highlight -->
    <rect x="191" y="207" width="76" height="20" rx="4" fill="url(#orange)"/>
    <text
      x="202"
      y="220"
      font-family="monospace"
      font-size="8"
