<svg
  width="760"
  height="500"
  viewBox="0 0 760 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Screen glass -->
    <linearGradient id="screenFrame" x1="380" y1="55" x2="380" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20242A"/>
      <stop offset="1" stop-color="#080A0D"/>
    </linearGradient>

    <linearGradient id="screenSurface" x1="180" y1="100" x2="580" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15181D"/>
      <stop offset="1" stop-color="#080A0D"/>
    </linearGradient>

    <!-- Laptop body -->
    <linearGradient id="body" x1="120" y1="345" x2="640" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F8F6"/>
      <stop offset="0.5" stop-color="#D9DADF"/>
      <stop offset="1" stop-color="#AEB1B7"/>
    </linearGradient>

    <linearGradient id="keyboard" x1="170" y1="350" x2="590" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1E23"/>
      <stop offset="1" stop-color="#090B0E"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F06A3B"/>
      <stop offset="1" stop-color="#C94F28"/>
    </linearGradient>

    <!-- Screen glow -->
    <filter id="screenGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Laptop shadow -->
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Small soft shadow -->
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="177" y="96" width="406" height="242" rx="5"/>
    </clipPath>
  </defs>

  <!-- Ground shadow -->
  <ellipse
    cx="380"
    cy="448"
    rx="245"
    ry="25"
    fill="#000"
    opacity="0.18"
    filter="url(#shadow)"
  />

  <!-- Ambient screen glow -->
  <ellipse
    cx="380"
    cy="240"
    rx="205"
    ry="145"
    fill="#D85A32"
    opacity="0.10"
    filter="url(#screenGlow)"
  />

  <!-- ========================= -->
  <!-- DISPLAY -->
  <!-- ========================= -->

  <!-- Outer display -->
  <path
    d="M169 75
       C171 65 180 58 191 58
       H569
       C580 58 589 65 591 75
       L618 343
       H142
       L169 75Z"
    fill="url(#screenFrame)"
    stroke="#3B3E43"
    stroke-width="3"
  />

  <!-- Display highlight -->
  <path
    d="M191 64H569C576 64 581 69 582 76L609 335H151L178 76C179 69 184 64 191 64Z"
    stroke="#FFFFFF"
    stroke-opacity="0.10"
  />

  <!-- Inner screen -->
  <rect
    x="177"
    y="96"
    width="406"
    height="242"
    rx="5"
    fill="url(#screenSurface)"
  />

  <!-- Screen UI -->
  <g clip-path="url(#screenClip)">

    <!-- Browser top bar -->
    <rect x="177" y="96" width="406" height="31" fill="#101216"/>

    <!-- Traffic lights -->
    <circle cx="191" cy="111" r="4" fill="#F06448"/>
    <circle cx="204" cy="111" r="4" fill="#E6B84B"/>
    <circle cx="217" cy="111" r="4" fill="#4DBA73"/>

    <!-- URL -->
    <rect
