  </g>

  <!-- Trackpad -->
  <path
    d="M319 382H441L454 405H306L319 382Z"
    fill="#17191D"
    stroke="#45484E"
    stroke-width="1.5"
  />

  <!-- Trackpad highlight -->
  <path
    d="M323 384H437"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
  />

  <!-- Front edge -->
  <path
    d="M76 407H684L678 422H82L76 407Z"
    fill="#D7D8DB"
  />

  <!-- Center notch -->
  <path
