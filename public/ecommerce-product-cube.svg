<svg width="220" height="180" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeTop" x1="72" y1="52" x2="143" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#D9DCE2"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="72" y1="75" x2="72" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8DCE3"/>
      <stop offset="1" stop-color="#AEB4C0"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="143" y1="75" x2="143" y2="133" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9CDD5"/>
      <stop offset="1" stop-color="#8F96A3"/>
    </linearGradient>

    <linearGradient id="accent" x1="105" y1="47" x2="126" y2="71" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F47A4A"/>
      <stop offset="1" stop-color="#CF522C"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse
    cx="111"
    cy="143"
    rx="61"
    ry="11"
    fill="#101319"
    opacity=".17"
    filter="url(#shadow)"
  />

  <!-- Product cube -->
  <path
    d="M71 72L109 51L148 72L109 94L71 72Z"
    fill="url(#cubeTop)"
    stroke="#A9AFB9"
    stroke-width="1.5"
  />

  <path
    d="M71 72L109 94V139L71 116V72Z"
    fill="url(#cubeLeft)"
    stroke="#9DA4AE"
    stroke-width="1.5"
  />

  <path
    d="M148 72L109 94V139L148 116V72Z"
    fill="url(#cubeRight)"
    stroke="#858D99"
    stroke-width="1.5"
  />

  <!-- Top facets -->
  <path
    d="M109 51L148 72L136 79L97 58L109 51Z"
    fill="#E8EAE9"
  />

  <path
    d="M71 72L109 51L121 58L83 79L71 72Z"
    fill="#FFFFFF"
    opacity=".55"
  />

  <!-- Cube highlight -->
  <path
    d="M78 77L104 92V128"
    stroke="#FFFFFF"
    stroke-opacity=".42"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Tiny data indicator -->
  <circle cx="133" cy="107" r="4" fill="#38C878"/>
  <circle cx="133" cy="107" r="7" stroke="#38C878" stroke-opacity=".18"/>

  <!-- Floating commerce badge -->
  <g transform="translate(48 39)">
    <rect
      x="0"
      y="0"
      width="31"
      height="31"
      rx="7"
      fill="url(#accent)"
    />

    <!-- Cart -->
    <path
      d="M8 9H11L13.5 19H23L26 12H13"
      stroke="white"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle cx="15" cy="23" r="2" fill="white"/>
    <circle cx="22" cy="23" r="2" fill="white"/>
  </g>

  <!-- Floating connection line -->
  <path
    d="M79 54L91 64"
    stroke="#D75B35"
    stroke-opacity=".35"
    stroke-width="1"
    stroke-dasharray="3 4"
  />

  <!-- Product base reflection -->
  <ellipse
    cx="110"
    cy="140"
    rx="35"
    ry="6"
    fill="#000"
    opacity=".08"
    filter="url(#soft)"
  />
</svg>
